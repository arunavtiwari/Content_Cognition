<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Cognition — Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body{margin:0;font-family:Inter,sans-serif;background:#070b1d;color:#e7edff}
    .wrap{max-width:1180px;margin:0 auto;padding:20px}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    .btn{cursor:pointer;border:1px solid rgba(139,165,240,.25);color:#fff;background:linear-gradient(135deg,rgba(103,232,249,.18),rgba(167,139,250,.2));padding:10px 14px;border-radius:12px;font-weight:600;text-decoration:none}
    .studio{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .panel{background:rgba(16,22,45,.72);border:1px solid rgba(139,165,240,.25);border-radius:18px;padding:16px}
    label{display:block;margin:8px 0 6px;color:#9db0da;font-size:.9rem}
    input,textarea{width:100%;background:rgba(9,13,27,.8);color:#e7edff;border:1px solid rgba(139,165,240,.25);border-radius:10px;padding:10px}
    .row{display:flex;gap:10px}
    #results .idea{margin-top:10px;border:1px solid rgba(139,165,240,.25);padding:10px;border-radius:10px;background:rgba(8,12,25,.8)}
    pre{white-space:pre-wrap;background:rgba(8,12,25,.85);border:1px solid rgba(139,165,240,.25);border-radius:10px;padding:10px}
    @media (max-width:960px){.studio{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div style="font-weight:800">🎬 Creative Studio</div>
      <a class="btn" href="/">Back to Home</a>
    </div>

    <div class="studio">
      <div class="panel">
        <h2>Idea Generator</h2>
        <label>Niche</label><input id="niche" value="Fitness coaching" />
        <label>Audience</label><input id="audience" value="Busy professionals 25-40" />
        <label>Desired outcome</label><input id="outcome" value="Book consultation calls" />
        <div class="row">
          <div style="flex:1"><label>Content type</label><input id="contentType" value="reels" /></div>
          <div style="flex:1"><label>Platform</label><input id="platform" value="instagram" /></div>
        </div>
        <label>Brand voice</label><input id="voice" value="Evidence-based motivational" />
        <div class="row">
          <div style="flex:1"><label>Idea count</label><input id="ideaCount" type="number" min="1" max="25" value="5" /></div>
          <div style="flex:1"><label>LLM model</label><input id="llmModel" value="llama3.1" /></div>
        </div>
        <label><input id="useOssLlm" type="checkbox" /> Use open-source LLM (Ollama)</label>
        <button class="btn" onclick="generateIdeas()">Generate Ideas</button>
      </div>

      <div class="panel">
        <h2>Results + Optimizer</h2>
        <div id="results"></div>
        <label>Script input</label>
        <textarea id="scriptInput" rows="5">Hook: If you sit 8+ hours, your metabolism drops faster than you think.</textarea>
        <button class="btn" onclick="optimizeScript()">Optimize Script</button>
        <pre id="optimizedOutput"></pre>
      </div>
    </div>
  </div>

  <script>
    async function generateIdeas() {
      const payload = {
        niche: document.getElementById('niche').value,
        audience: document.getElementById('audience').value,
        desired_outcome: document.getElementById('outcome').value,
        content_type: document.getElementById('contentType').value,
        platform: document.getElementById('platform').value,
        brand_voice: document.getElementById('voice').value,
        idea_count: Number(document.getElementById('ideaCount').value),
        use_open_source_llm: document.getElementById('useOssLlm').checked,
        llm_model: document.getElementById('llmModel').value,
        llm_temperature: 0.4,
        constraints: [],
        meta_tribe_features: { attention_spike: 0.8, emotion_intensity: 0.7, novelty_signal: 0.6 }
      };
      const res = await fetch('/generate-ideas', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
      const data = await res.json();

      const container = document.getElementById('results');
      container.innerHTML = `<p style="color:#9db0da">Skills: ${data.selected_skills.join(', ')}</p>`;
      data.ideas.forEach((idea) => {
        const div = document.createElement('div');
        div.className = 'idea';
        div.innerHTML = `<h3>${idea.title}</h3><p><b>Hook:</b> ${idea.hook}</p><p><b>CTA:</b> ${idea.cta}</p><p style="color:#9db0da">Total ${idea.total_score} | Viral ${idea.virality_score} | Conv ${idea.conversion_score}</p><pre>${idea.script}</pre>`;
        container.appendChild(div);
      });
    }

    async function optimizeScript() {
      const payload = {
        script: document.getElementById('scriptInput').value,
        desired_outcome: document.getElementById('outcome').value,
        brand_voice: document.getElementById('voice').value,
        platform: document.getElementById('platform').value,
        mirofish_enabled: true
      };
      const res = await fetch('/optimize-script', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
      const data = await res.json();
      document.getElementById('optimizedOutput').textContent = `${data.optimized_script}\n\nReport: ${JSON.stringify(data.report, null, 2)}`;
    }
  </script>
</body>
</html>
